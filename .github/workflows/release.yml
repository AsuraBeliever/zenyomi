name: Release
on:
  push:
    tags:
      - v*

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_tag:
    if: github.repository == 'AsuraBeliever/zenyomi'
    name: Extract tag name
    runs-on: 'ubuntu-24.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    if: github.repository == 'AsuraBeliever/zenyomi'
    name: Build
    runs-on: 'ubuntu-24.04'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # El job firmado empaqueta cinco APK — el universal y los cuatro por ABI, unos 640 MB
      # en total — sobre los intermedios de R8 y las nativas de mpv y ffmpeg. El runner trae
      # unos 14 GB libres y en la v0.18.1 no llegaron: `packageRelease` murió sin nombrar su
      # causa, mientras el job FOSS, que empaqueta uno solo, terminaba sin problema. Lo que
      # se borra aquí no lo usa esta build.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # --stacktrace porque sin él Gradle corta la causa: la v0.18.1 solo dijo "A failure
      # occurred while executing PackageAndroidArtifact$IncrementalSplitterRunnable" y hubo
      # que deducir el motivo. Un release rojo tiene que decir por qué a la primera.
      - name: Build
        run: .github/scripts/gradle-with-retry.sh assembleRelease -Penable-updater --stacktrace
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk zenyomi-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk zenyomi-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk zenyomi-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release.apk zenyomi-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk zenyomi-x86_64-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenyomi
          path: |
            zenyomi-${{ needs.get_tag.outputs.tag }}.apk
            zenyomi-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            zenyomi-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            zenyomi-x86-${{ needs.get_tag.outputs.tag }}.apk
            zenyomi-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  build_foss:
    if: github.repository == 'AsuraBeliever/zenyomi'
    name: Build (FOSS)
    runs-on: ubuntu-24.04
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      # The dependency cache stays on, unlike upstream Mihon's workflow. Disabled, this job
      # resolved all eleven JitPack dependencies from scratch on every run, and it was the
      # only job that ever failed on them — `Build`, which caches, has never failed once.
      # A tag is not the default branch, so setup-gradle makes the cache read-only here and
      # there is no write race with the `Build` job running alongside.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build
        run: .github/scripts/gradle-with-retry.sh assembleFoss -Penable-updater --stacktrace
        env:
          storeFileBase64: ${{ secrets.SIGNING_KEY }}
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/foss/app-universal-foss.apk zenyomi-${{ needs.get_tag.outputs.tag }}-foss.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenyomi-foss
          path: zenyomi-${{ needs.get_tag.outputs.tag }}-foss.apk

  release:
    if: github.repository == 'AsuraBeliever/zenyomi'
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [get_tag, build, build_foss]
    # Mihon published releases with a bot PAT; we use the workflow's own token,
    # which is read-only by default and returns 403 on release creation.
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: |
            zenyomi
            zenyomi-foss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Zenyomi ${{ needs.get_tag.outputs.tag }}
          body: |
            Zenyomi is a manga reader and anime player in one app. It uses [Mihon](https://github.com/mihonapp/mihon) as its technical base and ports [Aniyomi](https://github.com/aniyomiorg/aniyomi)'s anime features onto it.

            See the [changelog](https://github.com/AsuraBeliever/zenyomi/blob/main/CHANGELOG.md) for what changed in this version, and [`docs/ROADMAP.md`](https://github.com/AsuraBeliever/zenyomi/blob/main/docs/ROADMAP.md) for where the project is heading.

            > [!TIP]
            >
            > ### Not sure which file to pick? Download `zenyomi-${{ needs.get_tag.outputs.tag }}.apk`

            > [!IMPORTANT]
            >
            > Zenyomi installs alongside Mihon and Aniyomi rather than over them, so you can keep all three. Restore a Mihon backup from **More → Backup and restore** to bring your library across.
          # No files here on purpose: this step only writes the release and its notes. The
          # APKs go up in the step below, one at a time. Handing all six to this action
          # uploads them in parallel and the step dies as a whole on `Headers Timeout Error`
          # — six files and 800 MB do not reliably fit in one window. Worse, it clears the
          # release's assets before re-uploading, so a failed retry leaves *fewer* files than
          # the attempt before it: the v0.17.0 release went 5 assets, then 3.
          # Published, not a draft. When this created drafts, every tag ended up with two
          # entries — CI's draft and the one published by hand — sharing a tag name, and
          # `gh release delete <tag>` then removes whichever it picks first.
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      # One at a time, each retried on its own, and --clobber so re-running the workflow
      # replaces a file instead of tripping over it. A flaky upload now costs that one file
      # another try rather than the whole release.
      - name: Upload the APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks the repository out — it only downloads the built APKs — so
          # gh has no git remote to work the repository out from and fails with
          # "not a git repository" before it uploads anything.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.get_tag.outputs.tag }}
        run: |
          set -u
          for name in \
            "zenyomi-$TAG.apk" \
            "zenyomi-$TAG-foss.apk" \
            "zenyomi-arm64-v8a-$TAG.apk" \
            "zenyomi-armeabi-v7a-$TAG.apk" \
            "zenyomi-x86-$TAG.apk" \
            "zenyomi-x86_64-$TAG.apk"
          do
            for attempt in 1 2 3; do
              echo "Uploading $name (attempt $attempt)"
              if gh release upload "$TAG" "$name" --clobber; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::Could not upload $name after 3 attempts"
                exit 1
              fi
              sleep 30
            done
          done
          echo "Assets now on the release:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
